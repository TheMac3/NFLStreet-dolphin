# NFLStreet POC: Windows x64 build of Dolphin + the NSR netplay hook.
# Produces a downloadable zip of Binary/x64 (Dolphin.exe with Qt UI and all
# DLLs) for friends to test with. Build mirrors Dolphin's own Windows steps
# (MSBuild on dolphin-emu.sln, VS 2022 / v143, bundled Qt from Externals).
name: NSR Windows build

on:
  push:
    branches: [nsr-netplay]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # Dolphin's ScmRevGen uses git describe for the version string

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        working-directory: Source
        run: msbuild dolphin-emu.sln /m /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Add netplay launch helper
        shell: pwsh
        run: |
          @'
          @echo off
          rem NFLStreet POC netplay launcher (delay-based lockstep, 2-4 players).
          rem First run NSR-Patcher.exe in this folder once; it makes nsr-net.iso.
          rem Usage:  nsr-netplay.bat PLAYER PLAYERS [PEERS]
          rem   PLAYER  your number, 0..PLAYERS-1 (0 = the player everyone connects to)
          rem   PLAYERS 2, 3 or 4
          rem   PEERS   ip:port of players 0..PLAYER-1, comma-separated, in order
          rem           (player 0 leaves this out)
          rem Examples (4 players):
          rem   nsr-netplay.bat 0 4
          rem   nsr-netplay.bat 1 4 203.0.113.5:51515
          rem   nsr-netplay.bat 3 4 203.0.113.5:51515,198.51.100.7:51515,192.0.2.9:51515
          rem Every player except the last must forward UDP port 51515.
          rem Everyone must have the same NSR-Patcher fingerprint.
          rem This Dolphin is separate from Reborn: portable.txt + -u keep its settings
          rem and saves in .\User. Reborn's install is only read (HD textures).
          if not exist "%~dp0nsr-net.iso" (
            echo nsr-net.iso not found. Run NSR-Patcher.exe in this folder first.
            pause
            exit /b 1
          )
          set NSR_NETPLAY=1
          set NSR_PLAYER=%1
          set NSR_PLAYERS=%2
          set NSR_PORT=51515
          set NSR_PEERS=%~3
          set NSR_DELAY=2
          set NSR_LOG=%~dp0nsr-p%1.log
          set TEXTURES=
          set REBORN=
          if exist "%~dp0nsr-reborn.txt" (
            set /p REBORN=<"%~dp0nsr-reborn.txt"
          )
          if defined REBORN set TEXTURES=-C "Dolphin.General.LoadPath=%REBORN%\content" -C GFX.Settings.HiresTextures=True
          "%~dp0Dolphin.exe" -u "%~dp0User" %TEXTURES% -C Dolphin.Core.CPUThread=False -C Dolphin.Core.EnableCustomRTC=True -C Dolphin.Core.CustomRTCValue=0x30000000 -C Dolphin.Core.SIDevice1=6 -C Dolphin.Core.SIDevice2=6 -C Dolphin.Core.SIDevice3=6 -e "%~dp0nsr-net.iso"
          '@ | Set-Content -Encoding ascii Binary/x64/nsr-netplay.bat
          # Portable mode: never read or write the shared Documents\Dolphin
          # Emulator folder (or any other Dolphin's settings, e.g. Reborn's).
          Set-Content -Encoding ascii Binary/x64/portable.txt ""

      - uses: actions/upload-artifact@v4
        with:
          name: NFLStreet-dolphin-windows-x64
          path: Binary/x64
          if-no-files-found: error
