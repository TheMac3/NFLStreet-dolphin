# NFLStreetRollback: Windows x64 build of Dolphin + the rollback netplay hook.
# Produces ONE friends zip (artifact NFLStreetRollback-windows-x64, folder
# NFLStreetRollback/): Binary/x64 (Dolphin.exe with Qt UI and all DLLs), the
# NFLStreetRollback.exe launcher and NFLStreetRollback-Patcher.exe built from Tools/NSR (vendored
# from NFLStreet by its scripts/sync-launcher-to-fork.sh; the launcher's web UI
# is Tools/NSR/nsr_launcher_ui.html shown through pywebview/Edge WebView2,
# with a tkinter fallback), README-FIRST.txt,
# VERSION.txt (fork SHA + build date), SOURCE.txt and the licence texts. No
# game data. User-visible names say NFLStreetRollback (short form NSRB), not
# Reborn's "NSR"; internal names (Tools/NSR, NSR_* variables, nsr-*.txt/.json,
# nsr-net.iso, this workflow's file name) stay for compatibility. Build mirrors Dolphin's own Windows steps (MSBuild on
# dolphin-emu.sln, VS 2022 / v143, bundled Qt from Externals).
name: NFLStreetRollback Windows build

on:
  push:
    branches: [nsr-netplay]
  workflow_dispatch:

jobs:
  windows-x64:
    # Hosted windows-2022 by default; the repo variable NSR_WINDOWS_RUNS_ON
    # (JSON) moves it to a self-hosted Windows runner, e.g.
    # ["self-hosted","Windows","X64","nsr-windows"] (NFLStreet docs/self-hosted-runner.md).
    runs-on: ${{ fromJSON(vars.NSR_WINDOWS_RUNS_ON || '"windows-2022"') }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # Dolphin's ScmRevGen uses git describe for the version string

      - name: Put PowerShell 7 on PATH (self-hosted)
        # The runner service's PATH is fixed when the service starts, so a
        # pwsh installed by setup-nsr-runner.ps1 may be invisible until a
        # reboot. cmd is always available; later steps find pwsh after this.
        if: ${{ runner.environment != 'github-hosted' }}
        shell: cmd
        # If it is not installed at all, fetch the official portable zip once
        # into the runner tool cache with Windows' built-in curl and tar.
        run: |
          if exist "%ProgramFiles%\PowerShell\7\pwsh.exe" goto installed
          set "PS7=%RUNNER_TOOL_CACHE%\nsr-pwsh-7.4.6"
          if exist "%PS7%\pwsh.exe" goto portable
          mkdir "%PS7%"
          curl.exe -sSfL -o "%RUNNER_TEMP%\pwsh.zip" https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.zip || exit /b 1
          tar.exe -xf "%RUNNER_TEMP%\pwsh.zip" -C "%PS7%" || exit /b 1
          :portable
          echo %PS7%>>"%GITHUB_PATH%"
          "%PS7%\pwsh.exe" -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"
          exit /b %ERRORLEVEL%
          :installed
          echo %ProgramFiles%\PowerShell\7>>"%GITHUB_PATH%"

      - uses: actions/setup-python@v5
        # Hosted runners only: on a self-hosted PC its installer runs a Windows
        # PowerShell 5.1 script, which the PC's execution policy may block.
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          python-version: "3.12"

      - name: Use the PC's Python 3.12 (self-hosted)
        # setup-nsr-runner.ps1 installs Python 3.12 with winget. The runner
        # service's PATH is fixed at service start, so locate it through the
        # py launcher (C:\Windows\py.exe) or the default install folders.
        if: ${{ runner.environment != 'github-hosted' }}
        shell: pwsh
        run: |
          # Machine-wide installs are registered under HKLM (any folder);
          # also try the py launcher and the default folders. The runner
          # service (NETWORK SERVICE) cannot see per-user installs and cannot
          # run the Python installer itself (MSI error 1601), so a machine-wide
          # Python 3.12 must exist (setup-nsr-runner.ps1 installs one).
          $cands = @()
          foreach ($key in "HKLM:\SOFTWARE\Python\PythonCore\3.12\InstallPath",
                           "HKLM:\SOFTWARE\WOW6432Node\Python\PythonCore\3.12\InstallPath") {
            $ip = Get-ItemProperty $key -ErrorAction SilentlyContinue
            if ($ip) { $cands += @($ip.ExecutablePath, (Join-Path ($ip.'(default)' + "") "python.exe")) }
          }
          try { $cands += (& py -3.12 -c "import sys; print(sys.executable)" 2>$null) } catch {}
          # A private copy next to the runner (C:\nsr-runner\python312), for
          # PCs where Windows Installer cannot install Python machine-wide:
          # docs/self-hosted-runner.md.
          $runnerRoot = Split-Path (Split-Path $env:RUNNER_WORKSPACE)
          $cands += @((Join-Path $runnerRoot "python312\python.exe"),
                      "$env:ProgramFiles\Python312\python.exe", "C:\Python312\python.exe")
          $cands += (Get-ChildItem "$env:ProgramFiles\Python3*\python.exe" -ErrorAction SilentlyContinue).FullName
          $exe = $cands | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Searched: $($cands -join '; ')"
            throw "No Python 3.12 visible to the runner. On the runner PC (admin): winget install --id Python.Python.3.12 --scope machine, or copy a Python 3.12 folder to $runnerRoot\\python312"
          }
          $dir = Split-Path $exe
          Add-Content $env:GITHUB_PATH $dir
          Add-Content $env:GITHUB_PATH (Join-Path $dir "Scripts")
          & $exe -c "import sys, tkinter; print(sys.version, 'tk', tkinter.TkVersion)"
          if ($LASTEXITCODE -ne 0) { throw "this Python lacks tkinter (the launcher fallback needs it)" }

      # Python first: these take a few minutes and fail fast, before the long
      # Dolphin build. pywebview pinned (6.2.1, 2026-04) so a new release
      # can't change the friends' exe silently; it pulls pythonnet for the
      # Edge WebView2 backend.
      - name: Check the vendored launcher tools (Tools/NSR)
        run: |
          python -m pip install pyinstaller "pywebview==6.2.1"
          python -c "import sys; sys.path.insert(0, 'Tools/NSR'); import isopatch, nsr_patcher, nsr_lobby; isopatch.check_patch_set(set(isopatch.NETPLAY_SET)); assert nsr_patcher.NETPLAY_MODE == nsr_lobby.RELEASE_MODE == 'rollback'; print(nsr_patcher.ROLLBACK_RECIPE)"
          $env:NSR_APP_DIR = (New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/nsr-selftest").FullName
          python -c "import sys; sys.path.insert(0, 'Tools/NSR'); import nsr_launcher as L; print('WebView2 Runtime:', L.webview2_version(), '-> UI:', L.choose_ui(webview2=L.webview2_version()))"
          # Web UI: the page must load in WebView2 and render a real snapshot.
          python Tools/NSR/nsr_launcher.py --selftest
          if ($LASTEXITCODE -ne 0) { throw "launcher web UI selftest failed" }
          # The tkinter fallback (PCs without WebView2) must still come up.
          python Tools/NSR/nsr_launcher.py --selftest --tk
          if ($LASTEXITCODE -ne 0) { throw "launcher tkinter selftest failed" }

      - name: Build the NFLStreetRollback launcher and patcher
        run: |
          # --collect-all: pywebview's WebView2 DLLs and pythonnet's runtime
          # are data/binaries PyInstaller would otherwise miss.
          pyinstaller --noconfirm --noupx --workpath pyi-build --distpath pyi-dist --onefile --windowed --name NFLStreetRollback --paths Tools/NSR --add-data "Tools/NSR/nsr_launcher_ui.html;." --collect-all webview --collect-all pythonnet --collect-all clr_loader Tools/NSR/nsr_launcher.py
          pyinstaller --noconfirm --noupx --workpath pyi-build --distpath pyi-dist --onefile --console --name NFLStreetRollback-Patcher --paths Tools/NSR Tools/NSR/nsr_patcher.py
          pyi-dist\NFLStreetRollback-Patcher.exe --help
          if ($LASTEXITCODE -ne 0) { throw "NFLStreetRollback-Patcher.exe --help failed" }
          # The frozen launcher must find its bundled page and WebView2 too.
          $env:NSR_APP_DIR = (New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/nsr-selftest-exe").FullName
          $p = Start-Process -FilePath "pyi-dist/NFLStreetRollback.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content -ErrorAction SilentlyContinue "$env:NSR_APP_DIR/nsr-launcher.log"
          if ($p.ExitCode -ne 0) { throw "NFLStreetRollback.exe --selftest failed ($($p.ExitCode))" }
          "NFLStreetRollback.exe: {0:N1} MB" -f ((Get-Item "pyi-dist/NFLStreetRollback.exe").Length / 1MB)

      - uses: microsoft/setup-msbuild@v2
        if: ${{ runner.environment == 'github-hosted' }}

      - name: Use the MSBuild that has the C++ toolset (self-hosted)
        # A PC can have several Visual Studio instances (e.g. Build Tools
        # without the C++ workload next to a full VS); setup-msbuild takes the
        # newest, which may lack Microsoft.Cpp.Default.props. Ask vswhere for
        # an instance with the x64 C++ tools and the v143 MSBuild support.
        if: ${{ runner.environment != 'github-hosted' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found: install Visual Studio 2022 with 'Desktop development with C++'" }
          & $vswhere -products * -format text -property installationPath | ForEach-Object { Write-Host "VS instance: $_" }
          $msbuild = & $vswhere -latest -products * -version "[17.0,18.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.Component.MSBuild `
            -find "MSBuild\Current\Bin\amd64\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
            throw "No Visual Studio 2022 instance with the C++ x64 tools. Install the 'Desktop development with C++' workload (Visual Studio Installer > Modify)."
          }
          Write-Host "MSBuild: $msbuild"
          Add-Content $env:GITHUB_PATH (Split-Path $msbuild)

      - name: Build (Release x64)
        working-directory: Source
        run: msbuild dolphin-emu.sln /m /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Add the direct-IP debug helper (rollback profile)
        shell: pwsh
        run: |
          # Not the friend path (that's NFLStreetRollback.exe): a minimal direct-IP
          # launch for debugging, with exactly the launcher's rollback profile
          # (tools/nsr_launcher.py ROLLBACK_ENV). A stale lockstep .bat would
          # be a release hazard, so the old nsr-netplay.bat is gone. It was called
          # nsr-netplay-debug.bat before the NFLStreetRollback rename.
          @'
          @echo off
          rem DEBUG ONLY. Friends: use NFLStreetRollback.exe (room codes) instead.
          rem NFLStreetRollback netplay by IP address, 2-4 players, same settings
          rem as the launcher's rollback mode (input delay 1, lockstep menus,
          rem rollback matches). Run NFLStreetRollback.exe once first (imports the local game/assets).
          rem Usage:  NFLStreetRollback-debug.bat PLAYER PLAYERS [PEERS] [SEED]
          rem   PLAYER  your number, 0..PLAYERS-1 (0 = the player everyone connects to)
          rem   PLAYERS 2, 3 or 4
          rem   PEERS   ip:port of player 0 (star topology; player 0 leaves this out,
          rem           use - when giving a SEED)
          rem   SEED    match seed; every player must use the same one (default fixed)
          rem Examples:  NFLStreetRollback-debug.bat 0 2
          rem            NFLStreetRollback-debug.bat 1 2 203.0.113.5:51515
          rem Player 0 must forward UDP port 51515 for internet play.
          rem Everyone must have the same nsr-net.iso fingerprint (NFLStreetRollback-Patcher shows it).
          setlocal
          if not exist "%~dp0nsr-net.iso" (
            echo nsr-net.iso not found. Run NFLStreetRollback-Patcher.exe in this folder first.
            pause
            exit /b 1
          )
          if "%~2"=="" (
            echo Usage: NFLStreetRollback-debug.bat PLAYER PLAYERS [PEERS] [SEED]
            pause
            exit /b 1
          )
          set NSR_NETPLAY=1
          set NSR_PLAYER=%~1
          set NSR_PLAYERS=%~2
          set NSR_PORT=51515
          set NSR_TOPOLOGY=star
          set NSR_PEERS=
          if not "%~3"=="" if not "%~3"=="-" set NSR_PEERS=%~3
          set NSR_SEED=0x13579BDF
          if not "%~4"=="" set NSR_SEED=%~4
          set NSR_DELAY=1
          set NSR_RB_NET=1
          set NSR_RB_DELAY=1
          set NSR_RB_MAX_PRED=7
          set NSR_RB_TIME_SYNC=1
          set NSR_RB_INSTANT_DISC=1
          set NSR_RB_IO_IDLE=1
          set NSR_RB_AUDIO_ROLLBACK=1
          set NSR_RB_VTIME_FROM=
          set NSR_TELEMETRY_LOCAL=1
          set NSR_LOG=%~dp0nsr-p%~1.log
          set SI1=0
          set SI2=0
          set SI3=0
          if %NSR_PLAYERS% GEQ 2 set SI1=6
          if %NSR_PLAYERS% GEQ 3 set SI2=6
          if %NSR_PLAYERS% GEQ 4 set SI3=6
          rem The launcher imports assets and writes our local ordered list.
          rem Debug starts never resolve or read a Reborn folder.
          set TEXTURES=-C Graphics.Settings.HiresTextures=True -C Graphics.Settings.CacheHiresTextures=False
          "%~dp0Dolphin.exe" -u "%~dp0User" %TEXTURES% -C Dolphin.Interface.UsePanicHandlers=False -C Dolphin.Core.CPUThread=False -C Dolphin.Core.EnableCustomRTC=True -C Dolphin.Core.CustomRTCValue=0x30000000 -C Dolphin.Core.SIDevice0=6 -C Dolphin.Core.SIDevice1=%SI1% -C Dolphin.Core.SIDevice2=%SI2% -C Dolphin.Core.SIDevice3=%SI3% -C Dolphin.Core.FastDiscSpeed=True -b -e "%~dp0nsr-net.iso"
          endlocal
          '@ | Set-Content -Encoding ascii Binary/x64/NFLStreetRollback-debug.bat
          # Portable mode: never read or write the shared Documents\Dolphin
          # Emulator folder (or any other Dolphin's settings, e.g. Reborn's).
          Set-Content -Encoding ascii Binary/x64/portable.txt ""
          Copy-Item "pyi-dist/NFLStreetRollback.exe" Binary/x64/
          Copy-Item "pyi-dist/NFLStreetRollback-Patcher.exe" Binary/x64/

      - name: Room server address (if configured)
        if: ${{ vars.NSR_RENDEZVOUS != '' }}
        shell: pwsh
        run: Set-Content -Encoding ascii Binary/x64/nsr-rendezvous.txt "${{ vars.NSR_RENDEZVOUS }}"

      - name: Package (README-FIRST, VERSION, licenses, contents check)
        shell: pwsh
        run: |
          $sha = (git rev-parse --short HEAD).Trim()
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm 'UTC'")
          $nfl = (Select-String -Path Tools/NSR/README.md -Pattern 'commit ([0-9a-f]+)').Matches[0].Groups[1].Value
          $recipe = (python -c "import sys; sys.path.insert(0, 'Tools/NSR'); import nsr_patcher as p; print(p.ROLLBACK_RECIPE)").Trim()
          $fp = (python -c "import sys; sys.path.insert(0, 'Tools/NSR'); import nsr_patcher as p; print(' '.join(p.fingerprint(o) for _, o in p.KNOWN_INPUTS.values()))").Trim()
          $repo = "${{ github.server_url }}/${{ github.repository }}"
          $pkg = "package/NFLStreetRollback"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          # Fail before staging/uploading any player's imported asset store.
          $privateDirs = Get-ChildItem -Recurse -Directory Binary/x64 | Where-Object {
            $_.Name -in 'Assets','User','NSRTextures','GN7E69','prompt-packages' }
          if ($privateDirs) { throw "Local Reborn assets must never be packaged" }
          Copy-Item -Recurse Binary/x64/* $pkg
          # Dolphin's self-updater would offer to replace this fork with an
          # official Dolphin build (no rollback netplay); friends get updates as a
          # new zip from Mason instead.
          Remove-Item -Force -ErrorAction SilentlyContinue "$pkg/Updater.exe"
          Copy-Item COPYING "$pkg/COPYING.txt"
          Copy-Item -Recurse LICENSES "$pkg/LICENSES"
          @"
          NFLStreetRollback (private test build for Mason and friends)
          Build:          $sha  ($date)
          Branch:         ${{ github.ref_name }}
          Workflow run:   $repo/actions/runs/${{ github.run_id }}
          Launcher from:  NFLStreet commit $nfl
          Netplay:        rollback (menus in lockstep, matches in rollback)
          Image recipe:   $recipe
          Expected game fingerprint (Reborn 2026.09.12): $fp
          "@ | Set-Content -Encoding utf8 "$pkg/VERSION.txt"
          @"
          This package contains a modified build of Dolphin (GPL-2.0-or-later).
          Corresponding source: $repo/tree/$sha
          (fork commit $sha; licence texts in COPYING.txt and LICENSES/).
          "@ | Set-Content -Encoding utf8 "$pkg/SOURCE.txt"
          @"
          NFLSTREETROLLBACK - READ ME FIRST
          =================================

          Version: $sha, built $date (see VERSION.txt).
          This download has NO game in it. You use your own copy of
          NFL Street Reborn, and nothing in your Reborn install is changed.

          1. Install NFL Street Reborn from its official site and start it once
             to make sure it works. Then close it.

          2. Unzip this whole folder somewhere you can write to, for example
             your Desktop or Documents (not inside Program Files, and not
             inside the Reborn folder). Keep all the files together.

          3. Double-click NFLStreetRollback.exe. The first time (and after an
             update that needs it) it finds Reborn and builds this folder's own
             game copy by itself (nsr-net.iso, about 1.4 GB, takes a minute),
             then shows a fingerprint. Expected: $fp
             If it can't find Reborn, use "Browse for NSR.iso..." (Reborn
             folder\content\games\NSR.iso). NFLStreetRollback-Patcher.exe does
             the same build on its own and is only needed for troubleshooting.
             If NFLStreetRollback.exe disappears after unzipping, Windows
             Security quarantined it (unsigned test build): Windows Security ->
             Virus & threat protection -> Protection history -> Restore.

          4. In NFLStreetRollback.exe:
             - Settings: type your name.
             - Controllers: nothing to do if your controller works in
               NFL Street Reborn. NFLStreetRollback copies your Reborn controller
               setup (from Reborn's launcher, Controllers page) every time it
               starts a game. Your controller is always Port 1. Plug it in
               before you start.
               To change it: change it in Reborn's launcher, then click
               "Use my Reborn controller settings". Or click "Set up
               controllers..." to map it in NFLStreetRollback's own Dolphin only;
               that mapping is kept until you click "Use my Reborn
               controller settings" again.
             - Host: Host -> "Create room" -> send friends the code
               (NSRB-XXXXX) -> "Start game" when everyone is listed.
             - Join: Join -> type the code -> "Join room" -> wait for the host.
             Everyone must use this same download and have the same game
             fingerprint; the room tells you if someone doesn't.
             If the window looks plain (no sidebar), Windows is missing the
             Microsoft Edge WebView2 Runtime; everything still works.

          Updating from an older "NSR Netplay" download (folder
          NFLStreet-Rollback): copy everything in this NFLStreetRollback
          folder into the old folder, so your name, settings, controller
          mapping (User folder) and nsr-net.iso carry over, then delete the old "NSR Netplay.exe", NSR-Patcher.exe and
          nsr-netplay-debug.bat. The launcher rebuilds the game copy by itself
          when it is out of date.

          Windows SmartScreen: this test build isn't code-signed, so Windows may
          say "Windows protected your PC". Click "More info", then "Run anyway".
          Only do that for a zip you got directly from Mason. Don't turn off
          your antivirus.

          Windows Firewall: the first time a game starts, Windows may ask
          whether Dolphin can use the network. Tick "Private networks" (and
          "Public networks" if you're on a network Windows calls public) and
          click "Allow access". Netplay can't connect without it.

          The "Send lag/rollback stats" box (on by default) sends connection
          and rollback numbers, your name and the room code to Mason's server
          so he can fix lag. Never your button presses or any files. Untick it
          to send nothing.

          First launch imports textures and button icons into Assets/ using
          your own Reborn install. Later launches use this local store and
          nsr-net.iso even if Reborn is removed. Settings > Advanced > Re-import
          from Reborn refreshes it; rebuilding the game image needs Reborn's
          NSR.iso again. Nothing is sent anywhere during local import.

          Never share game files: not nsr-net.iso, NSR.iso, Assets/, User/,
          or anything from Reborn. Everyone imports their own copy in step 3.

          If something breaks, tell Mason what the window said, and send the
          nsr-p*.log files from this folder if he asks.
          (NFLStreetRollback-debug.bat is a developer tool; you don't need it.)
          "@ | Set-Content -Encoding utf8 "$pkg/README-FIRST.txt"
          # Contents guard: no game images, saves, memory cards, dumps or secrets.
          $bad = Get-ChildItem -Recurse -File $pkg | Where-Object {
            $_.Extension -in '.iso','.gcm','.rvz','.wbfs','.ciso','.gcz','.nkit','.gci','.sav','.dtm','.env','.pem','.key' -or
            ($_.Name -like 'tex1_*') -or
            $_.Name -in 'nsr-telemetry.txt','nsr-net.iso','nsr-image.json','nsr-reborn.txt','nsr-launcher.json','nsr-launcher.log','GCPadNew.ini.before-reborn-import' }
          if ($bad) { $bad | ForEach-Object { Write-Error "unexpected file in package: $($_.FullName)" }; exit 1 }
          foreach ($f in 'Dolphin.exe','NFLStreetRollback.exe','NFLStreetRollback-Patcher.exe','README-FIRST.txt','VERSION.txt','SOURCE.txt','portable.txt') {
            if (-not (Test-Path "$pkg/$f")) { throw "missing $f" }
          }
          if (Test-Path "$pkg/nsr-netplay.bat") { throw "stale lockstep nsr-netplay.bat in package" }
          foreach ($f in 'NSR Netplay.exe','NSR-Patcher.exe','nsr-netplay-debug.bat') {
            if (Test-Path "$pkg/$f") { throw "pre-rename file $f in package (now NFLStreetRollback*)" }
          }
          if (Test-Path "$pkg/Updater.exe") { throw "Dolphin Updater.exe must not ship (it would replace the fork)" }
          Get-Content "$pkg/VERSION.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: NFLStreetRollback-windows-x64
          path: package
          if-no-files-found: error
