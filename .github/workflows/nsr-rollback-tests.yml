# Socket-free rollback protocol and logic checks; no game data or emulator.
name: NSR rollback tests

on:
  push:
    branches: [nsr-netplay]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # Off when NSR_LINUX_CI=off (the same suite runs locally on Linux before
    # every merge); otherwise hosted Ubuntu or NSR_LINUX_RUNS_ON (JSON).
    if: ${{ vars.NSR_LINUX_CI != 'off' }}
    runs-on: ${{ fromJSON(vars.NSR_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile with warnings as errors
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -UNDEBUG -I Source/Core \
            Tools/NSR/NSRRollbackNetplayTest.cpp \
            Source/Core/Core/NSR/NSRRollbackNetplay.cpp \
            -o "$RUNNER_TEMP/nsr-rollback-tests"
      - name: Run rollback tests
        run: "$RUNNER_TEMP/nsr-rollback-tests"

  windows:
    runs-on: ${{ fromJSON(vars.NSR_WINDOWS_RUNS_ON || '"windows-2022"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile with MSVC warnings as errors
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /UNDEBUG /I Source/Core `
            Tools/NSR/NSRRollbackNetplayTest.cpp `
            Source/Core/Core/NSR/NSRRollbackNetplay.cpp `
            /Fe:"$env:RUNNER_TEMP\nsr-rollback-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run rollback tests
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\nsr-rollback-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
